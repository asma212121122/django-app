<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin:0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            
            
        }
        .Content {
            width: 350px;
        }
        .Title {
            width: 100%;
            height: 100px;
            background: #bd365e;
            
            color: #ffff;
            margin-bottom: 20px;
            border-radius: 8px 8px 0 0;
        }
        .Title h1{
            padding:30px 20px;
        }
        input {
            border: 1px solid #bd365e;
            width: 200px;
            height: 20px;
            margin: 0 0px 0px 20px;
            padding: 10px 0;
            border-radius: 4px 0 0 4px  ;
        }
        button {
            background: #bd365e;
            color: #ffff;
            border: none;
            width: 50px;
            height: 41.2px;
            border-radius:0 4px 4px 0;
        }
        ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 0;
            
        }
        li {
            border: 1px solid #d6d1d1;
            list-style: none;
            padding: 10px 5px;
            width: 95%;

        }
        li p {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="Content">
        <div class="Title">
            <h1 > To-Do List</h1>
        </div>
    

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="New task..." required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {% if task.completed %}
                    <s>{{ task.title }}</s>
                {% else %}
                    {{ task.title }}
                {% endif %}
            </li>
        {% empty %}
            <p>No tasks yet</p>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
